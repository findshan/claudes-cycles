<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude's Cycles — Hamiltonian Decomposition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a12;
            --panel: #0f0f1e;
            --border: #1e1e38;
            --accent0: #38bdf8;
            --accent1: #fb7185;
            --accent2: #a78bfa;
            --text: #e2e8f0;
            --muted: #64748b;
            --hover: #1e1e38;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent0), var(--accent2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 12px;
            color: var(--muted);
            margin-top: 1px;
        }

        .badge {
            margin-left: auto;
            background: linear-gradient(135deg, #1e3a5f, #1a2040);
            border: 1px solid #2a4a78;
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--accent0);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Main layout ── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 260px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* m selector */
        .m-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .m-btn {
            padding: 8px 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
        }

        .m-btn:hover {
            background: var(--hover);
            color: var(--text);
        }

        .m-btn.active {
            background: linear-gradient(135deg, #1e3a5f, #1a2040);
            border-color: var(--accent0);
            color: var(--accent0);
        }

        /* Cycle toggles */
        .cycle-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .cycle-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.18s;
        }

        .cycle-row:hover {
            background: var(--hover);
        }

        .cycle-row.off {
            opacity: 0.38;
        }

        .cycle-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .cycle-label {
            font-size: 13px;
            font-weight: 500;
            flex: 1;
        }

        .cycle-count {
            font-size: 11px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .toggle-icon {
            font-size: 14px;
            margin-left: 2px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent0), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-key {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* View controls */
        .view-btns {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .view-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-btn:hover {
            background: var(--hover);
            color: var(--text);
        }

        .view-btn.active {
            background: var(--hover);
            border-color: var(--accent0);
            color: var(--accent0);
        }

        /* Speed */
        .speed-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-label {
            font-size: 11px;
            color: var(--muted);
            min-width: 55px;
            font-family: 'JetBrains Mono', monospace;
        }

        input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent0);
            cursor: pointer;
        }

        /* Play / pause */
        .anim-controls {
            display: flex;
            gap: 8px;
        }

        .anim-btn {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.18s;
        }

        .anim-btn:hover {
            background: var(--hover);
        }

        .anim-btn.primary {
            background: linear-gradient(135deg, #1e3a5f, #1a2040);
            border-color: var(--accent0);
            color: var(--accent0);
        }

        /* ── Canvas ── */
        .canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── HUD ── */
        .hud {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 30, 0.82);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 18px;
            font-size: 11px;
            color: var(--muted);
            pointer-events: none;
            white-space: nowrap;
        }

        .hud span {
            color: var(--text);
            margin: 0 4px;
        }

        /* ── Progress bar ── */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent0), var(--accent2));
            width: 0%;
            transition: width 0.1s linear;
        }

        /* ── Tooltip ── */
        .tooltip {
            position: absolute;
            background: rgba(15, 15, 30, 0.92);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 20;
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">⬡</div>
        <div>
            <div class="title">Claude's Cycles</div>
            <div class="subtitle">Hamiltonian Decomposition — Knuth, Feb 2026</div>
        </div>
        <div class="badge" id="verified-badge">✓ Verified</div>
    </header>

    <div class="main">
        <!-- Sidebar -->
        <div class="sidebar">

            <div class="section">
                <div class="section-label">Select m</div>
                <div class="m-buttons">
                    <button class="m-btn active" data-m="3">3</button>
                    <button class="m-btn" data-m="5">5</button>
                    <button class="m-btn" data-m="7">7</button>
                    <button class="m-btn" data-m="9">9</button>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Cycles</div>
                <div class="cycle-rows">
                    <div class="cycle-row" data-cycle="0">
                        <div class="cycle-dot" style="background:#38bdf8"></div>
                        <span class="cycle-label">Cycle 0</span>
                        <span class="cycle-count" id="c0-count">—</span>
                        <span class="toggle-icon">●</span>
                    </div>
                    <div class="cycle-row" data-cycle="1">
                        <div class="cycle-dot" style="background:#fb7185"></div>
                        <span class="cycle-label">Cycle 1</span>
                        <span class="cycle-count" id="c1-count">—</span>
                        <span class="toggle-icon">●</span>
                    </div>
                    <div class="cycle-row" data-cycle="2">
                        <div class="cycle-dot" style="background:#a78bfa"></div>
                        <span class="cycle-label">Cycle 2</span>
                        <span class="cycle-count" id="c2-count">—</span>
                        <span class="toggle-icon">●</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Statistics</div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-val" id="stat-m">3</div>
                        <div class="stat-key">m (odd)</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-verts">27</div>
                        <div class="stat-key">vertices</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-arcs">81</div>
                        <div class="stat-key">arcs total</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="stat-step">—</div>
                        <div class="stat-key">anim step</div>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Camera</div>
                <div class="view-btns">
                    <button class="view-btn active" id="btn-3d">⬡ 3D Perspective</button>
                    <button class="view-btn" id="btn-top">⬜ Top (i–j plane)</button>
                    <button class="view-btn" id="btn-front">⬜ Front (i–k plane)</button>
                    <button class="view-btn" id="btn-side">⬜ Side (j–k plane)</button>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Animation</div>
                <div class="anim-controls" style="margin-bottom:10px">
                    <button class="anim-btn primary" id="btn-play">▶ Play</button>
                    <button class="anim-btn" id="btn-reset">↺ Reset</button>
                </div>
                <div class="speed-wrap">
                    <span class="speed-label" id="speed-label">Speed ×1</span>
                    <input type="range" id="speed-range" min="1" max="20" value="5">
                </div>
            </div>

        </div>

        <!-- Canvas area -->
        <div class="canvas-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <canvas id="canvas"></canvas>
            <div class="hud">
                Drag to rotate&nbsp;<span>·</span>&nbsp;Scroll to zoom&nbsp;<span>·</span>&nbsp;Right-drag to pan
            </div>
            <div class="tooltip" id="tooltip"></div>
        </div>
    </div>

    <script>
        // ─── Data loader ────────────────────────────────────────────────────────────
        const COLORS = [0x38bdf8, 0xfb7185, 0xa78bfa];
        const COLOR_CSS = ['#38bdf8', '#fb7185', '#a78bfa'];

        async function loadData(m) {
            const r = await fetch(`results/cycles_m${m}.json`);
            return r.json();
        }

        // ─── Camera / interaction state ─────────────────────────────────────────────
        const state = {
            m: 3, data: null,
            visible: [true, true, true],
            animStep: 0, playing: false, speed: 5,
            // camera
            theta: 0.5, phi: 0.4, radius: 4,
            panX: 0, panY: 0,
            drag: false, rightDrag: false,
            lastX: 0, lastY: 0,
            view: '3d',
        };

        // ─── Canvas 3D renderer (pure Canvas2D with projection) ─────────────────────
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            const wrap = canvas.parentElement;
            W = canvas.width = wrap.clientWidth * devicePixelRatio;
            H = canvas.height = wrap.clientHeight * devicePixelRatio;
            canvas.style.width = wrap.clientWidth + 'px';
            canvas.style.height = wrap.clientHeight + 'px';
            draw();
        }

        // Projection: 3D → 2D
        function project([x, y, z]) {
            if (state.view === '3d') {
                // Rotate around Y then X
                const cosT = Math.cos(state.theta), sinT = Math.sin(state.theta);
                const cosP = Math.cos(state.phi), sinP = Math.sin(state.phi);
                const rx = x * cosT + z * sinT;
                const ry = -x * sinT * sinP + y * cosP + z * cosT * sinP;
                const rz = x * sinT * cosP - y * sinP + z * cosT * cosP;
                const scale = (W / 2) / (state.radius + rz);
                return [
                    W / 2 + (rx + state.panX) * scale,
                    H / 2 + (-ry + state.panY) * scale,
                    rz, scale
                ];
            } else if (state.view === 'top') {
                // i → screenX, j → screenY (looking down k-axis)
                const sc = W * 0.55 / (state.m - 1 || 1);
                return [W / 2 + (x - (state.m - 1) / 2) * sc + state.panX, H / 2 + (y - (state.m - 1) / 2) * sc + state.panY, 0, sc];
            } else if (state.view === 'front') {
                // i → screenX, k → screenY (looking along j)
                const sc = W * 0.55 / (state.m - 1 || 1);
                return [W / 2 + (x - (state.m - 1) / 2) * sc + state.panX, H / 2 + (z - (state.m - 1) / 2) * sc + state.panY, 0, sc];
            } else {
                // j → screenX, k → screenY (looking along i)
                const sc = W * 0.55 / (state.m - 1 || 1);
                return [W / 2 + (y - (state.m - 1) / 2) * sc + state.panX, H / 2 + (z - (state.m - 1) / 2) * sc + state.panY, 0, sc];
            }
        }

        function normalizeCoords(v, m) {
            // center at 0, scale to [-1,1]
            return v.map(x => (x - (m - 1) / 2) / ((m - 1) || 1) * 2);
        }

        let animId = null;
        let animFrame = 0;

        function draw() {
            if (!state.data) return;
            ctx.clearRect(0, 0, W, H);

            const m = state.m;
            const cycles = state.data.cycles;
            const n = m * m * m;
            const displaySteps = Math.min(state.animStep + 1, n);

            // Draw faint grid lines (bounding box)
            drawBBox(m);

            // For each cycle, draw edges up to animStep
            for (let c = 2; c >= 0; c--) {
                if (!state.visible[c]) continue;
                const cycle = cycles[c];
                const col = COLORS[c];
                const colStr = COLOR_CSS[c];
                const steps = Math.min(displaySteps, cycle.length);

                // Draw edges
                ctx.lineWidth = Math.max(1, (2.5 / m) * devicePixelRatio);
                ctx.shadowBlur = 8 * devicePixelRatio;
                ctx.shadowColor = colStr;

                for (let t = 0; t < steps - 1; t++) {
                    const v0 = normalizeCoords(cycle[t], m);
                    const v1 = normalizeCoords(cycle[t + 1], m);
                    const [x0, y0, , s0] = project(v0);
                    const [x1, y1, ,] = project(v1);

                    const alpha = t < steps - 2 ? 0.55 : 1.0;
                    ctx.strokeStyle = hexToRgba(col, alpha);
                    ctx.beginPath();
                    ctx.moveTo(x0, y0);
                    ctx.lineTo(x1, y1);
                    ctx.stroke();
                }

                // Draw vertex dots
                ctx.shadowBlur = 0;
                const dotR = Math.max(2.5, (5 / m)) * devicePixelRatio;
                for (let t = 0; t < steps; t++) {
                    const v = normalizeCoords(cycle[t], m);
                    const [px, py, ,] = project(v);
                    const isTip = (t === steps - 1);
                    ctx.beginPath();
                    ctx.arc(px, py, isTip ? dotR * 2 : dotR, 0, Math.PI * 2);
                    if (isTip) {
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = 12 * devicePixelRatio;
                        ctx.shadowColor = colStr;
                    } else {
                        ctx.fillStyle = colStr;
                        ctx.shadowBlur = 0;
                    }
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            // Update progress
            document.getElementById('progress').style.width =
                (displaySteps / n * 100) + '%';
            document.getElementById('stat-step').textContent = displaySteps + '/' + n;
        }

        function drawBBox(m) {
            const corners = [];
            for (let i = 0; i <= 1; i++)
                for (let j = 0; j <= 1; j++)
                    for (let k = 0; k <= 1; k++)
                        corners.push(normalizeCoords([i * (m - 1), j * (m - 1), k * (m - 1)], m));

            const edges = [
                [0, 1], [0, 2], [0, 4],
                [7, 6], [7, 5], [7, 3],
                [1, 3], [1, 5], [2, 3], [2, 6], [4, 5], [4, 6],
            ];

            ctx.strokeStyle = 'rgba(255,255,255,0.07)';
            ctx.lineWidth = 1 * devicePixelRatio;
            ctx.shadowBlur = 0;
            for (const [a, b] of edges) {
                const [x0, y0] = project(corners[a]);
                const [x1, y1] = project(corners[b]);
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.stroke();
            }

            // Axis labels
            const labels = [['i', [1, 0, 0]], ['j', [0, 1, 0]], ['k', [0, 0, 1]]];
            ctx.font = `${11 * devicePixelRatio}px Inter, sans-serif`;
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            for (const [lbl, v] of labels) {
                const nc = normalizeCoords(v.map(x => x * (m - 1)), m);
                const [px, py] = project(nc);
                ctx.fillText(lbl, px + 5 * devicePixelRatio, py);
            }
        }

        function hexToRgba(hex, a) {
            const r = (hex >> 16) & 0xff;
            const g = (hex >> 8) & 0xff;
            const b = hex & 0xff;
            return `rgba(${r},${g},${b},${a})`;
        }

        // ─── Animation ───────────────────────────────────────────────────────────────
        function animate() {
            if (!state.playing) return;
            const n = state.m ** 3;
            animFrame++;
            const stepsPerFrame = Math.ceil(state.speed / 5);
            if (animFrame % Math.max(1, Math.round(6 / state.speed)) === 0) {
                state.animStep = Math.min(state.animStep + stepsPerFrame, n);
            }
            draw();
            if (state.animStep >= n) {
                state.playing = false;
                document.getElementById('btn-play').textContent = '▶ Play';
                return;
            }
            requestAnimationFrame(animate);
        }

        // ─── UI event wiring ─────────────────────────────────────────────────────────
        document.querySelectorAll('.m-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.m = +btn.dataset.m;
                state.playing = false;
                document.getElementById('btn-play').textContent = '▶ Play';
                await loadM(state.m);
            });
        });

        document.querySelectorAll('.cycle-row').forEach(row => {
            row.addEventListener('click', () => {
                const c = +row.dataset.cycle;
                state.visible[c] = !state.visible[c];
                row.classList.toggle('off', !state.visible[c]);
                draw();
            });
        });

        document.getElementById('btn-play').addEventListener('click', () => {
            state.playing = !state.playing;
            document.getElementById('btn-play').textContent = state.playing ? '⏸ Pause' : '▶ Play';
            if (state.playing) {
                if (state.animStep >= state.m ** 3) state.animStep = 0;
                requestAnimationFrame(animate);
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            state.animStep = 0;
            state.playing = false;
            document.getElementById('btn-play').textContent = '▶ Play';
            draw();
        });

        document.getElementById('speed-range').addEventListener('input', e => {
            state.speed = +e.target.value;
            document.getElementById('speed-label').textContent = `Speed ×${Math.round(state.speed / 5 * 10) / 10 || 1}`;
        });

        // Camera presets
        const viewBtns = { '3d': 'btn-3d', 'top': 'btn-top', 'front': 'btn-front', 'side': 'btn-side' };
        Object.entries(viewBtns).forEach(([v, id]) => {
            document.getElementById(id).addEventListener('click', () => {
                state.view = v;
                state.panX = state.panY = 0;
                if (v === '3d') { state.theta = 0.5; state.phi = 0.4; state.radius = 4; }
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                draw();
            });
        });

        // Mouse drag
        canvas.addEventListener('mousedown', e => {
            if (e.button === 2) { e.preventDefault(); state.rightDrag = true; }
            else state.drag = true;
            state.lastX = e.clientX; state.lastY = e.clientY;
        });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('mousemove', e => {
            const dx = e.clientX - state.lastX;
            const dy = e.clientY - state.lastY;
            state.lastX = e.clientX; state.lastY = e.clientY;
            if (state.drag && state.view === '3d') {
                state.theta -= dx * 0.008;
                state.phi += dy * 0.008;
                state.phi = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, state.phi));
                draw();
            } else if ((state.drag || state.rightDrag)) {
                state.panX += dx * devicePixelRatio;
                state.panY += dy * devicePixelRatio;
                draw();
            }
        });
        window.addEventListener('mouseup', () => { state.drag = false; state.rightDrag = false; });
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            state.radius = Math.max(1.5, Math.min(12, state.radius + e.deltaY * 0.005));
            draw();
        }, { passive: false });

        // Load data
        async function loadM(m) {
            state.data = await loadData(m);
            state.animStep = state.data.cycles[0].length; // show full by default
            state.visible = [true, true, true];
            document.querySelectorAll('.cycle-row').forEach(r => r.classList.remove('off'));

            // Update stats
            document.getElementById('stat-m').textContent = m;
            document.getElementById('stat-verts').textContent = state.data.num_vertices;
            document.getElementById('stat-arcs').textContent = state.data.total_arcs;
            ['c0-count', 'c1-count', 'c2-count'].forEach((id, idx) => {
                document.getElementById(id).textContent = state.data.cycles[idx].length + ' v';
            });
            draw();
        }

        window.addEventListener('resize', resize);
        resize();
        loadM(3);
    </script>
</body>

</html>
